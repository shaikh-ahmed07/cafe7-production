@keyframes fadeInDown {

.container {

.menu-item {

.menu-item:nth-child(1) { animation-delay: 0.1s; }

.menu-item:nth-child(5) { animation-delay: 0.5s; }
.menu-item:nth-child(6) { animation-delay: 0.6s; }
.menu-item:nth-child(7) { animation-delay: 0.7s; }

@keyframes fadeInUp {

        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);

}

<script>
async function updateCartBadge() {
    var token = localStorage.getItem('cafe7_access_token');
    if (!token) return;
    try {
        var res = await fetch('/api/cart/', {
            headers: {'Authorization': 'Bearer ' + token}
        });
        if (!res.ok) return;
        var data = await res.json();
        var count = data.item_count || 0;
        document.querySelectorAll('.cart-count').forEach(function(el) {
            el.textContent = count;
            el.style.display = count > 0 ? 'inline-block' : 'none';
        });
    } catch(e) {}
}

document.addEventListener('DOMContentLoaded', updateCartBadge);

document.addEventListener('click', async function(e) {
    var btn = e.target;
    if (!btn.classList.contains('btn')) return;
    if (btn.textContent.indexOf('Add') === -1 && btn.textContent.indexOf('Adding') === -1) return;

    var itemId = btn.getAttribute('data-item-id');
    if (!itemId) return;

    var token = localStorage.getItem('cafe7_access_token');
    if (!token) {
        if (confirm('Please login to add items to cart. Go to login page?')) {
            window.location.href = 'login.html';
        }
        return;
    }

    e.preventDefault();
    e.stopPropagation();

    var card = btn.closest('.content') || btn.closest('.coffee-item') ||
               btn.closest('.shake-item') || btn.closest('.menu-item') ||
               btn.closest('.desert-item') || btn.parentElement;
    var qtyInput = card ? card.querySelector('.quantity-input') : null;
    var qty = qtyInput ? parseInt(qtyInput.value) || 1 : 1;

    var original = btn.textContent;
    btn.textContent = 'Adding...';
    btn.disabled = true;

    try {
        var res = await fetch('/api/cart/add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({menu_item_id: parseInt(itemId), quantity: qty})
        });
        var data = await res.json();
        if (res.ok) {
            btn.textContent = 'Added!';
            btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
            // Update badge immediately after adding
            updateCartBadge();
            setTimeout(function() {
                btn.textContent = original;
                btn.style.background = '';
                btn.disabled = false;
            }, 1500);
        } else if (res.status === 401) {
            localStorage.removeItem('cafe7_access_token');
            alert('Session expired. Please login again.');
            window.location.href = 'login.html';
        } else {
            alert(data.error || 'Could not add to cart');
            btn.textContent = original; btn.disabled = false;
        }
    } catch(err) {
        alert('Server error.');
        btn.textContent = original; btn.disabled = false;
    }
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var user = localStorage.getItem('cafe7_user');
    if (!user) return;
    try {
        var u = JSON.parse(user);
        // Find cart link in navbar and add user name before it
        var navLinks = document.querySelectorAll('.nav-link, .navbar a');
        navLinks.forEach(function(link) {
            if (link.href && link.href.includes('cart.html')) {
                var userBadge = document.createElement('span');
                userBadge.style.cssText = 'margin-right:15px;font-weight:600;color:#b56b33;font-size:0.9rem;';
                userBadge.innerHTML = '👤 ' + u.name.split(' ')[0] + 
                    ' | <a href="#" onclick="doLogout()" style="color:#999;font-size:0.85rem;text-decoration:none;">Logout</a>';
                link.parentElement.parentElement.insertBefore(
                    document.createElement('li'), link.parentElement
                ).appendChild(userBadge);
            }
        });
    } catch(e) {}
});

function doLogout() {
    localStorage.removeItem('cafe7_access_token');
    localStorage.removeItem('cafe7_refresh_token');
    localStorage.removeItem('cafe7_user');
    window.location.href = 'login.html';
}
</script>
